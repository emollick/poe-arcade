# poe-arcade — Netlify configuration
#
# There is NO BUILD STEP. The repository is the deployable site: a fresh clone
# with no toolchain installed deploys as-is. Any compiled artifact (e.g. the
# Black Cat's games/black-cat/sim.wasm) is built locally and its OUTPUT
# COMMITTED beside the game, so this stays true.

[build]
  publish = "."
  command = ""

# --- HTML: always revalidate -------------------------------------------------
# Games and the launcher change often; never let a CDN pin a stale page.

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/games/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- Immutable assets --------------------------------------------------------
# /vendor/* is pinned third-party code and self-hosted fonts. /shared/* is the
# common chrome. Both are safe to cache hard; bump a query string to bust.

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/shared/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts need a permissive CORS header to be usable cross-origin (e.g. a Netlify
# deploy-preview domain embedding the primary one).
[[headers]]
  for = "/vendor/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# --- Correct type for wasm ----------------------------------------------------
# Streaming instantiation (WebAssembly.instantiateStreaming) REQUIRES
# application/wasm; without it the browser falls back to a slower path or
# refuses the module. The wasm sits beside its game (games/black-cat/sim.wasm)
# under a URL with no content hash, so it deliberately gets NO immutable
# Cache-Control here: the /games/* rule above keeps it revalidated, and a
# rebuilt sim.wasm is picked up on the next visit. The exact-path rule is the
# belt to the wildcard's braces.

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/games/black-cat/sim.wasm"
  [headers.values]
    Content-Type = "application/wasm"

# --- Site-wide safety headers ------------------------------------------------
# Deliberately NOT set: Cross-Origin-Opener-Policy / Cross-Origin-Embedder-Policy.
# Enabling COOP+COEP would cross-origin-isolate the site and break any script,
# font or texture that is not served with CORP/CORS. We do not need
# SharedArrayBuffer, so the cost is all downside.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(self), gyroscope=(self), camera=(), microphone=(), geolocation=(), payment=(), usb=(), midi=(), interest-cohort=()"

# --- Redirects ---------------------------------------------------------------
# NONE. Deep links to /games/<name>/ must resolve straight to that directory's
# index.html. A catch-all SPA rewrite (/* -> /index.html) would silently send
# every game URL to the launcher, so do not add one.
