<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pluto — The Black Cat</title>
<link rel="stylesheet" href="/shared/fonts.css">
<link rel="stylesheet" href="/shared/poe.css">
<link rel="stylesheet" href="style.css">

<canvas id="wall" aria-label="The cellar wall"></canvas>

<!-- ============ in-game chrome ============ -->
<div id="hud" hidden>
  <div id="hud-top">
    <div id="sweep-label"><span class="k">SWEEP</span> <span id="sweep-num">I</span> <span class="k">OF IV</span></div>
    <div id="attention">
      <div class="k">THEIR ATTENTION</div>
      <div id="susp-bar"><div id="susp-fill"></div></div>
    </div>
    <div id="unseen"><span id="unseen-num">0</span><span class="k"> s UNSEEN</span> <span id="streak" hidden></span></div>
  </div>

  <div id="caption" aria-live="polite"></div>

  <div id="hud-bottom">
    <button id="btn-wide" class="ledge-btn" type="button" aria-pressed="false"><span>WIDE TROWEL</span><small>shift · 2nd finger</small></button>
    <button id="btn-breath" class="ledge-btn" type="button"><span>HOLD BREATH</span><small>space</small></button>
  </div>

  <svg id="trowel" viewBox="0 0 160 120" aria-label="Trowel load">
    <defs>
      <clipPath id="blade-clip"><path d="M8 46 L110 30 L128 42 L110 100 L20 96 Z"/></clipPath>
      <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#9c948a"/><stop offset=".5" stop-color="#5b554e"/><stop offset="1" stop-color="#3a3531"/>
      </linearGradient>
      <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#5a3a24"/><stop offset=".5" stop-color="#8a5a34"/><stop offset="1" stop-color="#3f2716"/>
      </linearGradient>
    </defs>
    <!-- blade -->
    <path d="M8 46 L110 30 L128 42 L110 100 L20 96 Z" fill="url(#steel)" stroke="#1c1917" stroke-width="1.5"/>
    <!-- plaster load, clipped to the blade; JS scales it -->
    <g clip-path="url(#blade-clip)">
      <rect id="load" x="0" y="100" width="160" height="100" fill="#e9dfc9"/>
      <rect id="load-lip" x="0" y="99" width="160" height="3" fill="#fbf5e6" opacity=".8"/>
    </g>
    <!-- neck + handle -->
    <path d="M118 40 C 132 34, 138 26, 140 20" fill="none" stroke="#2a2623" stroke-width="5" stroke-linecap="round"/>
    <rect x="100" y="6" width="56" height="16" rx="7" transform="rotate(-24 128 14)" fill="url(#wood)" stroke="#1c1917" stroke-width="1.2"/>
  </svg>
</div>

<!-- ============ title ============ -->
<section id="title" class="screen">
  <div class="title-inner">
    <p class="eyebrow">Edgar Allan Poe · The Black Cat · the fourth day</p>
    <h1>PLUTO</h1>
    <p class="lede">The police are in the cellar. Drag to plaster over the damp before their lantern finds what is in the wall. Four sweeps, and they leave.</p>
    <button id="btn-start" class="cta" type="button">Take up the trowel</button>
    <p id="best" class="best"></p>
  </div>
</section>

<!-- ============ end ============ -->
<section id="end" class="screen" hidden>
  <div class="end-inner">
    <p id="end-kicker" class="eyebrow"></p>
    <blockquote id="end-quote"></blockquote>
    <div id="end-score">
      <div class="score-main"><span id="score-num">0</span></div>
      <div id="score-breakdown" class="score-breakdown"></div>
    </div>
    <button id="btn-again" class="cta" type="button">Again</button>
    <p id="end-best" class="best"></p>
  </div>
</section>

<div id="flash"></div>

<script type="module" src="game.js"></script>
