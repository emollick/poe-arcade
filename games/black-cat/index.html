<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pluto — The Black Cat</title>
<link rel="stylesheet" href="/shared/fonts.css">
<link rel="stylesheet" href="/shared/poe.css">
<link rel="stylesheet" href="style.css">

<canvas id="wall" aria-label="The cellar wall"></canvas>

<!-- ============ in-game chrome ============ -->
<div id="hud" hidden>
  <div id="hud-top">
    <div id="sweep-label"><span class="k">SWEEP</span> <span id="sweep-num">I</span> <span class="k">OF IV</span></div>
    <div id="attention">
      <div class="k">THEIR ATTENTION</div>
      <div id="susp-bar"><div id="susp-fill"></div></div>
    </div>
    <div id="unseen"><span id="unseen-num">0</span><span class="k"> s UNSEEN</span> <span id="streak" hidden></span></div>
  </div>

  <div id="caption" aria-live="polite"></div>

  <div id="hud-bottom">
    <button id="btn-wide" class="ledge-btn" type="button" aria-pressed="false"><span>WIDE TROWEL</span><small>shift · 2nd finger</small></button>
    <button id="btn-breath" class="ledge-btn" type="button"><span>HOLD BREATH</span><small>space</small></button>
  </div>

</div>

<!-- ============ title ============ -->
<section id="title" class="screen">
  <div class="title-inner">
    <p class="eyebrow">Edgar Allan Poe · The Black Cat · the fourth day</p>
    <h1>PLUTO</h1>
    <p class="lede">The police are in the cellar. Drag to plaster over the damp before their lantern finds what is in the wall. Four sweeps, and they leave.</p>
    <button id="btn-start" class="cta" type="button">Take up the trowel</button>
    <p id="best" class="best"></p>
  </div>
</section>

<!-- ============ end ============ -->
<section id="end" class="screen" hidden>
  <div class="end-inner">
    <p id="end-kicker" class="eyebrow"></p>
    <blockquote id="end-quote"></blockquote>
    <div id="end-score">
      <div class="score-main"><span id="score-num">0</span></div>
      <div id="score-breakdown" class="score-breakdown"></div>
    </div>
    <button id="btn-again" class="cta" type="button">Again</button>
    <p id="end-best" class="best"></p>
  </div>
</section>

<div id="flash"></div>

<script type="module" src="game.js"></script>
