[package]
name = "black_cat_sim"
version = "0.1.0"
edition = "2021"
description = "Plaster / damp / crack simulation for the Poe arcade game 'Pluto' (The Black Cat). Compiled to wasm32-unknown-unknown with no bindgen; hand-written JS glue over linear memory."

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
