<!doctype html>
<!-- REFERENCE IMPLEMENTATION. Not a game. Shows the exact boilerplate every
     game needs and must always PASS: node tools/verify.mjs tools/selftest -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>selftest</title>
<link rel="stylesheet" href="/shared/fonts.css">
<link rel="stylesheet" href="/shared/poe.css">
<canvas id="c" style="position:fixed;inset:0;width:100%;height:100%"></canvas>
<script type="module">
import { mountBack, fitCanvas, createAudio, saveState, loadState, prefersReducedMotion, onFirstGesture } from '/shared/poe.js';
mountBack();
const audio = createAudio();
saveState('selftest', { n: (loadState('selftest', { n: 0 }).n) + 1 });
onFirstGesture(() => console.log('gesture'));
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W = 0, H = 0;
fitCanvas(c, ({ width, height, dpr }) => { W = width; H = height; ctx.setTransform(dpr,0,0,dpr,0,0); });
let t = 0;
(function loop(){
  t += prefersReducedMotion() ? 0 : 0.02;
  ctx.fillStyle = '#0a0908'; ctx.fillRect(0,0,W,H);
  for (let i=0;i<180;i++){
    const x = (Math.sin(i*12.9898+t)*0.5+0.5)*W, y=(Math.sin(i*78.233+t*0.7)*0.5+0.5)*H;
    ctx.fillStyle = i%3? 'rgba(232,226,212,.7)' : '#7a0f12';
    ctx.beginPath(); ctx.arc(x,y,2+ (i%5),0,7); ctx.fill();
  }
  ctx.fillStyle='#b08d3f'; ctx.font="48px 'IM Fell English', serif";
  ctx.fillText('Nevermore', 40, H/2);
  requestAnimationFrame(loop);
})();
</script>
