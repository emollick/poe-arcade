<!doctype html>
<!-- REFERENCE: the three.js + matter-js wiring. Note the importmap — three.js
     addons all `import ... from 'three'` and will NOT resolve without it.
     Must always PASS: node tools/verify.mjs tools/threetest -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vendor test</title>
<link rel="stylesheet" href="/shared/poe.css">
<canvas id="c" style="position:fixed;inset:0;width:100%;height:100%"></canvas>
<script src="/vendor/matter/matter.min.js"></script>
<script type="importmap">
{ "imports": {
    "three": "/vendor/three/three.module.js",
    "three/addons/": "/vendor/three/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { mountBack, fitCanvas } from '/shared/poe.js';
mountBack();
const c = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas: c, antialias: true });
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0908);
const cam = new THREE.PerspectiveCamera(60, 1, 0.1, 100); cam.position.z = 4;
const controls = new OrbitControls(cam, c);
scene.add(new THREE.Mesh(new THREE.TorusKnotGeometry(1, .32, 160, 24),
  new THREE.MeshStandardMaterial({ color: 0xb08d3f, roughness: .35, metalness: .8 })));
scene.add(new THREE.PointLight(0xffffff, 60).translateZ(5), new THREE.AmbientLight(0x7a0f12, 2));
const composer = new EffectComposer(renderer);
fitCanvas(c, ({ width, height }) => { cam.aspect = width/height; cam.updateProjectionMatrix(); renderer.setSize(width, height, false); });
renderer.setAnimationLoop((t) => { scene.rotation.y = t/2000; renderer.render(scene, cam); });
window.__report = {
  three: THREE.REVISION,
  matter: (window.Matter && Matter.version) || null,
  addons: [typeof OrbitControls, typeof EffectComposer, typeof UnrealBloomPass, typeof GLTFLoader, typeof FontLoader].join(','),
  engine: !!(window.Matter && Matter.Engine.create()),
};
console.log('VENDOR REPORT ' + JSON.stringify(window.__report));
</script>
